[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vettv-service"
version = "0.1.0"
description = "VetTV MCE Layer 2 service daemon: ROM scanning, launching, Memory Card saves"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-2.0-only" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
vettv-service = "vettv_service.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/vettv_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
